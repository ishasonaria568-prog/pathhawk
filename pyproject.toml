[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathhawk"
version = "1.0.0"
description = "Advanced CLI-Based Web Asset Discovery & Reconnaissance Tool"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "ISHA SONARIA", email = "ishasonaria568@gmail.com"}
]
keywords = ["reconnaissance", "security", "enumeration", "web-discovery", "cybersecurity", "pathhawk"]

dependencies = [
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "dnspython>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
pathhawk = "pathhawk.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pathhawk*"]
